name: Combat Lab - guarded archive cleanup

# This workflow NEVER deletes branches on push. It runs a read-only rehearsal.
# The only deletion route requires a manual GitHub Actions dispatch on main,
# the explicit operation, and the exact human-typed confirmation phrase.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/archived-research-cleanup.yml'
      - 'tools/prune-archived-branches.mjs'
      - 'tools/validate-handoff.mjs'
      - 'tools/rehearse-archive-recovery.mjs'
      - 'docs/BRANCH_INVENTORY_2026-11-10.json'
  workflow_dispatch:
    inputs:
      operation:
        description: 'Choose AUDIT_ONLY first; DELETE_ARCHIVED_REFS is irreversible branch-reference cleanup'
        type: choice
        required: true
        default: AUDIT_ONLY
        options:
          - AUDIT_ONLY
          - DELETE_ARCHIVED_REFS
      backup_saved:
        description: 'I have stored the verified Git bundle outside this GitHub account'
        type: boolean
        required: false
        default: false
      confirmation:
        description: 'For deletion only: type DELETE_44_ARCHIVED_COMBAT_BRANCHES'
        type: string
        required: false
        default: ''

concurrency:
  group: combat-lab-archive-branch-cleanup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    if: github.repository == 'Jozzpoly/Combat-Lab' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout all ancestry - read only
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require exact typed confirmation for deletion mode
        env:
          OPERATION: ${{ inputs.operation }}
          CONFIRMATION: ${{ inputs.confirmation }}
          BACKUP_SAVED: ${{ inputs.backup_saved }}
        run: |
          if [[ "$OPERATION" == "DELETE_ARCHIVED_REFS" && "$CONFIRMATION" != "DELETE_44_ARCHIVED_COMBAT_BRANCHES" ]]; then
            echo "::error::Deletion selected without exact confirmation phrase."
            exit 1
          fi
          if [[ "$OPERATION" == "DELETE_ARCHIVED_REFS" && "$BACKUP_SAVED" != "true" ]]; then
            echo "::error::Download and separately store the verified Git bundle before deleting refs."
            exit 1
          fi
          if [[ "$OPERATION" != "" && "$OPERATION" != "AUDIT_ONLY" && "$OPERATION" != "DELETE_ARCHIVED_REFS" ]]; then
            echo "::error::Unknown operation"
            exit 1
          fi
      - name: Validate offline manifest and recovery documents
        run: node tools/validate-handoff.mjs
      - name: Cold-recover seven physical research cases from archive alone
        run: node tools/rehearse-archive-recovery.mjs
      - name: Audit live GitHub refs and archive ancestry (no deletion)
        run: node tools/prune-archived-branches.mjs
      - name: Confirm no branches changed during audit
        run: |
          echo "Archive and branch SHAs checked. This job has read-only credentials."
          echo "All removal requires an explicitly approved, separate job."

  delete:
    needs: [audit]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'Jozzpoly/Combat-Lab' &&
      github.ref == 'refs/heads/main' &&
      inputs.operation == 'DELETE_ARCHIVED_REFS' &&
      inputs.backup_saved == true &&
      inputs.confirmation == 'DELETE_44_ARCHIVED_COMBAT_BRANCHES'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout exact snapshot and all ancestry (only this job has write credentials)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Revalidate and delete ONLY exact inventoried archived refs
        run: |
          node tools/validate-handoff.mjs
          node tools/rehearse-archive-recovery.mjs
          node tools/prune-archived-branches.mjs --apply --confirm=DELETE_44_ARCHIVED_COMBAT_BRANCHES
      - name: Report remaining branch refs
        run: |
          git ls-remote --heads origin
          echo "Compare remaining refs to: main, rehearsal/current and archive/all-research-pre-provider-handoff-2026-11-10"
