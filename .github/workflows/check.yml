name: check

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run experiment checks when present
        shell: bash
        run: |
          if [ -f package.json ]; then
            npm test
          else
            echo "No package.json on this branch; nothing to test."
          fi

      - name: Live browser Workbench gate when present
        if: ${{ hashFiles('app.js') != '' }}
        shell: bash
        run: |
          python3 -m http.server 4173 > /tmp/combat-lab-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 0.25
          done

          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chromium-family browser available on runner."
            exit 1
          fi

          CHROME_BIN="$CHROME" \
          SCREENSHOT_PATH="workbench-source.png" \
          EXTREME_SCREENSHOT_PATH="workbench-extreme.png" \
          COMPACT_SCREENSHOT_PATH="workbench-compact.png" \
            node scripts/browser-live-gate.mjs http://127.0.0.1:4173/

      - name: Upload Workbench rehearsal screenshot
        if: ${{ always() && hashFiles('workbench-*.png') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: workbench-source-screenshot
          path: workbench-*.png
          retention-days: 7
