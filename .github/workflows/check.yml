name: check

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run experiment checks when present
        shell: bash
        run: |
          if [ -f package.json ]; then
            npm test
          else
            echo "No package.json on this branch; nothing to test."
          fi
