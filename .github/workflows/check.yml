name: check

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install declared dependencies
        if: ${{ hashFiles('package.json') != '' }}
        shell: bash
        run: |
          HAS_DEPS="$(node -e 'const p=require("./package.json"); const d={...(p.dependencies||{}),...(p.devDependencies||{})}; process.stdout.write(Object.keys(d).length ? "yes" : "no")')"
          if [ "$HAS_DEPS" = "yes" ]; then
            if [ -f package-lock.json ]; then
              npm ci --no-audit --no-fund
            else
              npm install --no-audit --no-fund
            fi
          fi

      - name: Run project checks when present
        shell: bash
        run: |
          if [ -f package.json ]; then
            npm test
          else
            echo "No package.json; no project checks declared."
          fi

      - name: Generic browser smoke when present
        if: ${{ hashFiles('index.html') != '' }}
        shell: bash
        run: |
          python3 -m http.server 4173 > /tmp/combat-lab-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 0.25
          done

          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"

          if [ -f scripts/browser-live-gate.mjs ]; then
            CHROME_BIN="$CHROME" node scripts/browser-live-gate.mjs http://127.0.0.1:4173/
          else
            "$CHROME" --headless=new --no-sandbox --disable-gpu \
              --virtual-time-budget=1200 \
              --dump-dom http://127.0.0.1:4173/ > /tmp/combat-lab-dom.html
            test -s /tmp/combat-lab-dom.html
          fi
