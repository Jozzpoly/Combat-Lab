name: P11 material brace falsifier

on:
  push:
    branches:
      - experiment/p11-material-brace-source
  workflow_dispatch:

jobs:
  actual-solver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked source
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Verify executable source syntax
        run: node --check src/p11-brace.js && node --check scripts/p11-browser.mjs && node --check p10-ui.js
      - name: Vite emitted browser bundle
        run: npm run build && test -s dist/p10.html
      - name: Run actual Rapier 15 material controls and four source-bound Chrome frames
        shell: bash
        run: |
          python3 -m http.server 4173 --directory dist >/tmp/p11-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/p10.html >/dev/null; then break; fi
            sleep .2
          done
          CHROME_BIN="$(command -v google-chrome || command -v chromium)" node scripts/p11-browser.mjs http://127.0.0.1:4173/
      - name: Archive real source frames, no simulated renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p11-real-bracing-source
          path: p11-evidence/
          if-no-files-found: ignore
          retention-days: 14
