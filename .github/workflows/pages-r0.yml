name: pages-r0

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pages-r0.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: combat-lab-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact R0 research branch
        uses: actions/checkout@v4
        with:
          ref: experiment/r0-geometric-melee-spike

      - name: Prepare static research specimen
        shell: bash
        run: |
          rm -rf dist
          mkdir dist
          cp index.html style.css main.js geometry.js dist/
          git rev-parse HEAD > dist/COMMIT.txt
          printf '%s\n' "experiment/r0-geometric-melee-spike" > dist/BRANCH.txt

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy exact R0 specimen
        id: deployment
        uses: actions/deploy-pages@v4
