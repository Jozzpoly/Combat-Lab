name: pages

on:
  workflow_run:
    workflows:
      - check
    types:
      - completed
    branches:
      - main
      - 'experiment/**'
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact branch, tag or commit SHA to deploy
        required: true
        default: main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: combat-lab-pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.head_branch == 'main' || contains(github.event.workflow_run.head_commit.message, '[deploy]'))) }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve explicit deploy source
        id: source
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SOURCE="${{ inputs.source_ref }}"
            LABEL="${{ inputs.source_ref }}"
          else
            SOURCE="${{ github.event.workflow_run.head_sha }}"
            LABEL="main"
          fi
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"

      - name: Checkout exact deploy source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.source }}

      - name: Prepare current specimen
        shell: bash
        run: |
          rm -rf dist
          mkdir dist
          cp index.html dist/
          for f in style.css main.js core.js scenario.js; do
            if [ -f "$f" ]; then cp "$f" dist/; fi
          done
          for d in organisms; do
            if [ -d "$d" ]; then cp -R "$d" dist/; fi
          done
          git rev-parse HEAD > dist/COMMIT.txt
          printf '%s\n' "${{ steps.source.outputs.label }}" > dist/BRANCH.txt

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.head_branch == 'main' || contains(github.event.workflow_run.head_commit.message, '[deploy]'))) }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy explicit CI-qualified state
        id: deployment
        uses: actions/deploy-pages@v4
