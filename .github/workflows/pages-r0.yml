name: pages

on:
  workflow_run:
    workflows:
      - check
    types:
      - completed
    branches:
      - main
      - experiment/control-commitment-spike
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: combat-lab-pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CI-qualified state
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || 'main' }}

      - name: Prepare current specimen
        shell: bash
        run: |
          rm -rf dist
          mkdir dist
          cp index.html dist/
          for f in style.css main.js core.js; do
            if [ -f "$f" ]; then cp "$f" dist/; fi
          done
          git rev-parse HEAD > dist/COMMIT.txt
          printf '%s\n' "${{ github.event.workflow_run.head_branch || 'main' }}" > dist/BRANCH.txt

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy CI-qualified state
        id: deployment
        uses: actions/deploy-pages@v4
