name: pages-r1

on:
  workflow_run:
    workflows:
      - check
    types:
      - completed
    branches:
      - experiment/r1-combat-organism
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: combat-lab-pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CI-qualified R1 specimen
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || 'experiment/r1-combat-organism' }}

      - name: Prepare static research specimen
        shell: bash
        run: |
          rm -rf dist
          mkdir dist
          cp index.html style.css main.js geometry.js dist/
          git rev-parse HEAD > dist/COMMIT.txt
          printf '%s\n' "experiment/r1-combat-organism" > dist/BRANCH.txt

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy CI-qualified R1 specimen
        id: deployment
        uses: actions/deploy-pages@v4
