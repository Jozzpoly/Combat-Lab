name: Combat Lab - verified Git bundle for offline backup

# Read-only. Generates an artifact; NEVER deletes refs or deploys Pages.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verified-offsite-git-backup.yml'
      - 'tools/create-pre-prune-backup.mjs'
      - 'README.md'
      - 'AGENTS.md'
      - 'docs/REPOSITORY_HANDOFF_2026-11-10.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: combat-lab-verified-offsite-backup
  cancel-in-progress: false

jobs:
  export:
    if: github.repository == 'Jozzpoly/Combat-Lab' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify archive inventory (offline)
        run: node tools/validate-handoff.mjs
      - name: Create Git bundle and independently restore 47 original refs
        run: node tools/create-pre-prune-backup.mjs
      - name: Upload human-downloadable bundle and SHA256
        uses: actions/upload-artifact@v4
        with:
          name: combat-lab-pre-prune-full-git-bundle
          path: _pre-prune-backup/*
          if-no-files-found: error
          retention-days: 90
