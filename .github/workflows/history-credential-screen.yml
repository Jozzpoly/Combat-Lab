name: Combat Lab - read-only full Git history credential screen

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/history-credential-screen.yml'
      - 'tools/screen-public-git-history.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen:
    if: github.repository == 'Jozzpoly/Combat-Lab' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Heuristic public history scan - no secret values printed
        run: node tools/screen-public-git-history.mjs
