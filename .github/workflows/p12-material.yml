name: P12 physical material push-off

on:
  push:
    branches:
      - experiment/p12-material-pushoff
  workflow_dispatch:

jobs:
  material-reaction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies (no committed lockfile)
        run: npm install --no-audit --no-fund
      - name: Parse P12 and existing UI
        run: node --check src/p12-pushoff.js && node --check p10-ui.js && node --check scripts/p12-browser.mjs
      - name: Build unchanged existing P10b page plus optional source probe
        run: npm run build && test -s dist/p10.html
      - name: Execute 21 real Rapier cases and 4 original physical frames
        shell: bash
        run: |
          python3 -m http.server 4173 --directory dist >/tmp/p12-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/p10.html >/dev/null; then break; fi
            sleep .2
          done
          CHROME_BIN="$(command -v google-chrome || command -v chromium)" node scripts/p12-browser.mjs http://127.0.0.1:4173/
      - name: Retain physical evidentiary frames/metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p12-material-reaction-source
          path: p12-evidence/
          if-no-files-found: ignore
          retention-days: 14
