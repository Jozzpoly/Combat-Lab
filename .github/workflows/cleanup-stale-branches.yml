name: one-time stale branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-stale-branches.yml

permissions:
  contents: write

jobs:
  delete-stale-refs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify ancestry and delete stale branch refs
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'

          branches=(
            "experiment/combat-terrarium-v1"
            "experiment/control-commitment-spike"
            "experiment/discovery-campaign-v1"
            "experiment/phenotype-combat-ecology-v0"
            "experiment/whole-combat-organisms-v0"
            "refoundation/combat-lab-vnext"
          )

          for branch in "${branches[@]}"; do
            remote_ref="refs/remotes/origin/${branch}"

            if ! git show-ref --verify --quiet "${remote_ref}"; then
              echo "Already absent: ${branch}"
              continue
            fi

            if ! git merge-base --is-ancestor "${remote_ref}" HEAD; then
              echo "::error::Refusing to delete non-ancestor branch: ${branch}"
              exit 1
            fi

            echo "Deleting ancestry-safe stale branch: ${branch}"
            git push origin --delete "${branch}"
          done

          git fetch origin --prune
          echo "Remaining remote heads:"
          git for-each-ref --format='%(refname:short)' refs/remotes/origin/
