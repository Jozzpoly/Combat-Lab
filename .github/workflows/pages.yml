name: pages

on:
  workflow_run:
    workflows: ["check"]
    types: [completed]
    branches:
      - rehearsal/current
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact branch, tag or commit SHA to deploy
        required: true
        default: rehearsal/current

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: combat-lab-pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve explicit deploy source
        id: source
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SOURCE="${{ inputs.source_ref }}"
            LABEL="${{ inputs.source_ref }}"
          else
            SOURCE="${{ github.event.workflow_run.head_sha }}"
            LABEL="${{ github.event.workflow_run.head_branch }}"
          fi
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"

      - name: Checkout exact deploy source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.source }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install declared dependencies
        if: ${{ hashFiles('package.json') != '' }}
        shell: bash
        run: |
          HAS_DEPS="$(node -e 'const p=require("./package.json"); const d={...(p.dependencies||{}),...(p.devDependencies||{})}; process.stdout.write(Object.keys(d).length ? "yes" : "no")')"
          if [ "$HAS_DEPS" = "yes" ]; then
            if [ -f package-lock.json ]; then
              npm ci --no-audit --no-fund
            else
              npm install --no-audit --no-fund
            fi
          fi

      - name: Prepare exact artifact
        shell: bash
        run: |
          HAS_BUILD="no"
          if [ -f package.json ]; then
            HAS_BUILD="$(node -e 'const p=require("./package.json"); process.stdout.write(p.scripts?.build ? "yes" : "no")')"
          fi

          if [ "$HAS_BUILD" = "yes" ]; then
            npm run build
            test -f dist/index.html
          else
            rm -rf dist
            mkdir dist
            rsync -a \
              --exclude='.git/' \
              --exclude='.github/' \
              --exclude='node_modules/' \
              --exclude='dist/' \
              --exclude='test/' \
              --exclude='tests/' \
              --exclude='docs/' \
              --exclude='*.md' \
              ./ dist/
            test -f dist/index.html
          fi

          printf '%s\n' "$(git rev-parse HEAD)" > dist/COMMIT.txt
          printf '%s\n' "${{ steps.source.outputs.label }}" > dist/BRANCH.txt

      - name: Qualify emitted browser artifact
        shell: bash
        run: |
          python3 -m http.server 4182 --directory dist > /tmp/combat-lab-dist-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4182/ > /dev/null; then
              break
            fi
            sleep 0.25
          done

          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"

          if [ -f scripts/browser-live-gate.mjs ]; then
            CHROME_BIN="$CHROME" node scripts/browser-live-gate.mjs http://127.0.0.1:4182/
          else
            "$CHROME" --headless=new --no-sandbox --disable-gpu \
              --virtual-time-budget=1200 \
              --dump-dom http://127.0.0.1:4182/ > /tmp/combat-lab-dist-dom.html
            test -s /tmp/combat-lab-dist-dom.html
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy exact checked state
        id: deployment
        uses: actions/deploy-pages@v4
