name: Combat Lab - one-time protective archive tag

# One-time safety anchor. A tag points to the same archival Git object;
# it does not duplicate source, create a new feature branch, or alter Pages.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/archive-anchor-once.yml'

permissions:
  contents: read

jobs:
  anchor:
    if: github.repository == 'Jozzpoly/Combat-Lab' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Pin one extra tag to the already-verified 46-parent archive
        shell: bash
        run: |
          set -euo pipefail
          TAG='archive/combat-lab-critical-history-2026-11-10'
          SHA='863c0a056e9e0dfa7e5895ccf443a8ecfd4f520d'
          test "$(git ls-remote --heads origin 'archive/all-research-pre-provider-handoff-2026-11-10' | cut -f1)" = "$SHA"
          git fetch --quiet origin "refs/heads/archive/all-research-pre-provider-handoff-2026-11-10"
          test "$(git cat-file -t "$SHA")" = commit
          test "$(git show -s --format='%P' "$SHA" | wc -w)" -eq 46
          EXISTING="$(git ls-remote --tags --refs origin "refs/tags/$TAG" | cut -f1)"
          if [[ -z "$EXISTING" ]]; then
            git push origin "$SHA:refs/tags/$TAG"
          else
            test "$EXISTING" = "$SHA"
          fi
          test "$(git ls-remote --tags --refs origin "refs/tags/$TAG" | cut -f1)" = "$SHA"
          echo "PASS: archive kept by two distinct GitHub refs with one shared commit object; no experiment branches deleted"
