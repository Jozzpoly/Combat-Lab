<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Combat Lab vNext — Refoundation Substrate</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <p class="eyebrow">Combat Lab vNext · neutral substrate</p>
        <h1 id="experiment-title">Loading…</h1>
        <p id="experiment-purpose" class="purpose"></p>
      </div>
      <div class="controls">
        <button id="pause" type="button">Pause</button>
        <button id="reset" type="button">Reset</button>
        <button id="debug" type="button">Debug</button>
      </div>
    </header>

    <section class="viewport">
      <canvas id="lab" aria-label="Combat Lab experiment surface"></canvas>
    </section>

    <footer>
      <div>
        <strong>Controls</strong>
        <span id="controls-text">—</span>
      </div>
      <div class="status">
        <span id="run-state">RUNNING</span>
        <span id="sim-time">0.00 s</span>
        <span id="build-id">source: local</span>
      </div>
    </footer>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
