<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Combat Lab vNext — Refoundation Substrate</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <p class="eyebrow">Combat Lab vNext · neutral substrate</p>
        <h1 id="experiment-title">Loading…</h1>
        <p id="experiment-purpose" class="purpose"></p>
      </div>
      <div class="controls">
        <select id="experiment-select" aria-label="Experiment"></select>
        <button id="pause" type="button">Pause</button>
        <button id="reset" type="button">Reset</button>
        <button id="debug" type="button">Debug</button>
      </div>
    </header>

    <section class="viewport">
      <canvas id="lab" aria-label="Combat Lab experiment surface"></canvas>
    </section>

    <footer>
      <div>
        <strong>Controls</strong>
        <span id="controls-text">—</span>
      </div>
      <div class="status">
        <span id="run-state">BOOTING</span>
        <span id="sim-time">0.00 s</span>
        <span id="build-id">source: local</span>
      </div>
    </footer>
  </main>
  <script>
    window.__combatLabRuntime = {
      state: "BOOTING",
      frames: 0,
      error: null,
      activeExperimentId: null,
      snapshot: null
    };

    function markRuntimeError(reason) {
      const runtime=window.__combatLabRuntime;
      runtime.state="ERROR";
      runtime.error=String(reason || "unknown runtime error");
      document.documentElement.dataset.runtimeState="ERROR";
      const status=document.querySelector("#run-state");
      if (status) status.textContent="ERROR";
    }

    window.addEventListener("error",event=>{
      markRuntimeError(event.error?.stack || event.message);
    });

    window.addEventListener("unhandledrejection",event=>{
      markRuntimeError(event.reason?.stack || event.reason);
    });
  </script>
  <script type="module" src="./app.js"></script>
</body>
</html>
